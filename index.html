<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Pearl London | Handcrafted Jewelry</title>
    <style>
        /* Using a serif font to match your elegant branding */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f9f6f4; /* Matches the soft cream in your banner */
            color: #333;
            font-family: 'Lato', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-banner {
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .hero-banner img {
            width: 100%;
            display: block;
        }

        .content {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .tagline {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #888;
            margin-bottom: 40px;
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .btn {
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn-primary {
            background-color: #333;
            color: #fff;
            border: 1px solid #333;
        }

        .btn-primary:hover {
            background-color: #555;
        }

        .btn-secondary {
            background-color: transparent;
            color: #333;
            border: 1px solid #ccc;
        }

        .btn-secondary:hover {
            background-color: #fff;
            border-color: #333;
        }

        .footer {
            margin-top: 60px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #aaa;
            padding-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="hero-banner">
        <img src="banner.png" alt="Aqua Pearl London Banner">
    </div>

    <div class="content">
        <h1>Aqua Pearl</h1>
        <p style="letter-spacing: 5px; font-size: 0.7rem; margin-top: -10px;">LONDON</p>
        <p class="tagline">Where every pearl tells a story of elegance</p>

        <div class="button-stack">
            <a href="https://www.etsy.com/uk/shop/Aquapearllondon" class="btn btn-primary">Shop on Etsy</a>
            <a href="YOUR_INSTAGRAM_URL" class="btn btn-secondary">Instagram</a>
            <a href="mailto:your-email@domain.com" class="btn btn-secondary">Contact Us</a>
        </div>
    </div>

    <div class="footer">
        © 2026 AQUA PEARL LONDON
    </div>

</body>
</html>
